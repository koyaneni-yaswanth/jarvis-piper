# JARVIS-PiPER Global Configuration
schema_version: "1.0.0"

robot:
  type: "agilex_piper_6dof"
  can_interface: "can0"
  bitrate: 1000000
  control_frequency_hz: 60.0

safety:
  speed_scale: 0.10             # Start at 10% speed
  max_joint_velocity_rad_s: 1.50
  max_step_delta_rad: 0.10
  watchdog_timeout_sec: 0.10
  tracking_timeout_sec: 0.05
  workspace_box:
    x: [0.10, 0.60]
    y: [-0.45, 0.45]
    z: [0.015, 0.55]

teleop:
  device: "pika_sense"
  translation_scale: 1.0
  cutoff_frequency_hz: 12.0
  sample_rate_hz: 60.0

recording:
  output_dir: "data/raw"
  save_video: true
  save_depth: true

training:
  algorithm: "behavior_cloning"
  epochs: 20
  batch_size: 32
  learning_rate: 0.001
  hidden_dim: 128
