name: CI

on:
  push:
    branches: [ main, master, develop, feature/vlm-upgrade ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Test Suite & End-to-End Pipeline
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pytest pytest-cov numpy

      - name: Run PyTest Suite (ROS-independent, MOCK mode only)
        run: |
          PYTHONPATH=python pytest tests/ \
            --ignore=tests/ros2 \
            -v \
            --tb=short \
            -x
        env:
          JARVIS_MODE: MOCK

      - name: Run VLM Mock-Mode Tests (no model download, no hardware)
        run: |
          PYTHONPATH=python pytest tests/unit/test_vlm_components.py -v --tb=short
        env:
          JARVIS_MODE: MOCK

      - name: Verify Environment & System Doctor
        run: |
          python -c "import jarvis; import jarvis_piper; print('Imports OK')"
        continue-on-error: false

      - name: Run Zero-Hardware End-to-End Demo
        run: |
          ./scripts/demo.sh
        continue-on-error: true  # Demo may require optional deps not installed in CI

