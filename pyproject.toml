[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-piper"
version = "1.0.0"
description = "An Open Embodied-AI Data Collection and Visual World Model Framework for PiPER Robotic Manipulation"
readme = "README.md"
authors = [{ name = "JARVIS Embodied AI Team", email = "recvn@example.com" }]
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Robotics",
]
keywords = ["robotics", "embodied-ai", "piper", "pika", "v-jepa", "imitation-learning"]
dependencies = [
    "numpy>=1.22.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]
ml = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
]
vlm = [
    # Tier 2: CLIP (CPU-capable, ~338 MB)
    "transformers>=4.36.0",
    "pillow>=9.0.0",
    "accelerate>=0.24.0",
    # Tier 3: BLIP (CPU-capable, ~990 MB) — same deps as CLIP
    # torch and torchvision already in [ml]
]
cameras = [
    # Uncomment on NUC after installing system-level RealSense SDK:
    # "pyrealsense2>=2.54.0",
    "opencv-python>=4.8.0",
]

[project.scripts]
jarvis = "jarvis.cli:main"
jarvis-piper = "jarvis_piper.cli.main:main"

[tool.setuptools.packages.find]
where = [".", "python"]
include = ["jarvis*", "jarvis_piper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["python", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py310"
